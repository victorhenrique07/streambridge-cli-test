[package]
name = "cli"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
parse_link_header = "0.4.1"
reqwest = { version = "0.13.4", features = ["query", "json"]}
serde = { version = "1.0.229", features = ["derive"]}
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
